name: Build VST3 Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
      
    steps:
    - name: Listar archivos generados
      shell: pwsh
      run: Get-ChildItem -Path build -Recurse -Include *.vst3,*.exe | Select-Object -ExpandProperty FullName
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Opalys-VST3-Windows
        path: build/Opalys_artefacts/Release/VST3/

    - name: Upload Standalone Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Opalys-Standalone-Windows
        path: build/Opalys_artefacts/Release/Standalone/
